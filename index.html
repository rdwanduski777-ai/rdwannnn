<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RDWAN</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#05050b,#15183a,#080812);
    color:white;
    text-align:center;
}

.container{
    max-width:500px;
    margin:auto;
    padding:35px 20px;
}

‎/* وێنەکەت */
.photo{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #6475ff;
    box-shadow:0 0 30px #6475ff;
    margin-bottom:20px;
}

‎/* ناونیشان */
h1{
    font-size:27px;
    margin:10px 0;
}

p{
    color:#bfc5ff;
}

‎/* دوگمەکان */
button{
    width:90%;
    margin:12px auto;
    padding:17px;
    border:none;
    border-radius:18px;
    background:linear-gradient(90deg,#465cff,#873cff);
    color:white;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 0 20px #465cff88;
    cursor:pointer;
    transition:.2s;
}

button:active{
    transform:scale(.94);
}

‎/* پەیام */
.message{
    margin:25px auto;
    padding:17px;
    width:90%;
    border-radius:18px;
    background:linear-gradient(90deg,#159447,#087238);
    font-size:16px;
    line-height:1.7;
}

‎/* لینک */
.link{
    color:#7e8cff;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

‎    <!-- وێنەکەت -->
    <img src="IMG_0164.jpeg" class="photo">

    <h1>بخێرهاتی بۆ کەناڵەکەم 🎮</h1>

    <p>
‎        لەگەل RDWAN بەردەوام بە ❤️
    </p>

‎    <!-- دوگمە -->
    <button onclick="telegram()">
        JOIN • بچۆ ناڤ Telegram
    </button>

    <button onclick="telegram()">
‎        📲 کەناڵێ من
    </button>

    <div class="message">
‎         ❤️زۆر سوپاس بۆ بەژداری کرنا تە د گەل مە
        <br>
‎        بۆ چونا ژور دگەل مەبە
    </div>

    <div class="link">
        @rdwanduski
    </div>

</div>

<script>

function telegram(){

    window.location.href =
    "https://t.me/rdwanduski";

}

</script>

</body>
</html>
